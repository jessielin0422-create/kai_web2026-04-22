<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Dictionary Search</title>
     <style>
          :root {
               --bg: #eef5ff;
               --card: #ffffff;
               --text: #1f3349;
               --accent: #286cf2;
               --accent-light: #d5e3ff;
               --border: rgba(34, 64, 129, 0.12);
          }

          * {
               box-sizing: border-box;
          }

          body {
               margin: 0;
               min-height: 100vh;
               font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
               color: var(--text);
               background: linear-gradient(180deg, #f3f7ff 0%, #d9e4ff 100%);
          }

          .page-wrap {
               max-width: 1080px;
               margin: 0 auto;
               padding: 1.5rem 1rem 2rem;
          }

          header {
               text-align: center;
               margin-bottom: 1.5rem;
          }

          header h1 {
               margin: 0;
               font-size: clamp(1.8rem, 2.2vw, 2.6rem);
               letter-spacing: 0.02em;
          }

          header p {
               margin: 0.5rem auto 0;
               color: #4b5e7d;
               max-width: 720px;
          }

          .search-panel {
               background: rgba(255, 255, 255, 0.95);
               border: 1px solid var(--border);
               border-radius: 20px;
               padding: 1.2rem 1.2rem 1rem;
               box-shadow: 0 18px 45px rgba(28, 54, 97, 0.08);
               margin-bottom: 1.5rem;
          }

          .search-panel form {
               display: flex;
               justify-content: center;
               flex-wrap: wrap;
               gap: 0.8rem;
               align-items: center;
          }

          .search-panel input[type="text"] {
               width: min(420px, 100%);
               padding: 0.9rem 1rem;
               border: 1px solid #c6d2e8;
               border-radius: 999px;
               font-size: 1rem;
               outline: none;
               transition: border-color 0.2s ease;
          }

          .search-panel input[type="text"]:focus {
               border-color: var(--accent);
               box-shadow: 0 0 0 4px rgba(40, 108, 242, 0.12);
          }

          .search-panel input[type="submit"] {
               padding: 0.95rem 1.5rem;
               border-radius: 999px;
               border: none;
               background: var(--accent);
               color: #fff;
               font-size: 1rem;
               cursor: pointer;
               transition: transform 0.2s ease, background 0.2s ease;
          }

          .search-panel input[type="submit"]:hover {
               background: #1f52d6;
               transform: translateY(-1px);
          }

          .status {
               text-align: center;
               margin-top: 1rem;
               padding: 0.9rem 1rem;
               border-radius: 16px;
               background: var(--accent-light);
               color: #163466;
               font-weight: 600;
          }

          .dict-card {
               background: rgba(255, 255, 255, 0.96);
               border: 1px solid var(--border);
               border-radius: 20px;
               overflow: hidden;
               margin-bottom: 1.5rem;
               box-shadow: 0 12px 28px rgba(23, 62, 122, 0.08);
          }

          .dict-card h3 {
               margin: 0;
               padding: 1rem 1.25rem;
               font-size: 1.15rem;
               background: linear-gradient(90deg, #f5f8ff 0%, #e8efff 100%);
               border-bottom: 1px solid var(--border);
               color: #1d3a62;
          }

          .dict-card iframe {
               border: none;
               height: 45vh;
               width: 100%;
          }

          .links {
               text-align: center;
               margin-top: 0.5rem;
          }

          .links a {
               display: inline-block;
               margin: 0.35rem 0.8rem;
               padding: 0.75rem 1.1rem;
               border-radius: 999px;
               background: #ffffff;
               border: 1px solid rgba(34, 64, 129, 0.18);
               color: #1f3a67;
               text-decoration: none;
               transition: transform 0.2s ease, box-shadow 0.2s ease;
          }

          .links a:hover {
               transform: translateY(-1px);
               box-shadow: 0 10px 18px rgba(34, 64, 129, 0.12);
          }

          @media (max-width: 768px) {
               .search-panel input[type="submit"] {
                    width: 100%;
               }

               .links a {
                    width: min(100%, 260px);
               }
          }
     </style>
</head>

<body>
     <div class="page-wrap">
          <header>
               <h1>雙重字典查詢</h1>
               <p>輸入單字後即可同時檢視 Merriam-Webster 與 Wikimedia 的單字頁面，操作更直覺。</p>
          </header>

          <section class="search-panel">
               <form id="searchForm">
                    <input type="text" id="searchWord" placeholder="請輸入單字，例如 apple" autofocus>
                    <input type="submit" value="搜尋">
               </form>
               <div class="status" id="currentWord">目前查詢：apple</div>
          </section>

          <section class="dict-card">
               <h3>Merriam-Webster</h3>
               <iframe id="frame1" src="https://www.merriam-webster.com/dictionary/apple" frameborder="0"></iframe>
          </section>

          <section class="dict-card">
               <h3>Wikimedia</h3>
               <iframe id="frame2" src="https://meta.wikimedia.org/wiki/Apple" frameborder="0"></iframe>
          </section>

          <div class="links">
               <a id="link1" href="https://www.merriam-webster.com/dictionary/apple" target="_blank" rel="noopener">在 Merriam-Webster 開啟</a>
               <a id="link2" href="https://meta.wikimedia.org/wiki/Apple" target="_blank" rel="noopener">在 Wikimedia 開啟</a>
          </div>
     </div>

     <script>
          const dict1 = "https://www.merriam-webster.com/dictionary/";
          const dict2 = "https://meta.wikimedia.org/wiki/";

          const input = document.getElementById("searchWord");
          const frame1 = document.getElementById("frame1");
          const frame2 = document.getElementById("frame2");
          const link1 = document.getElementById("link1");
          const link2 = document.getElementById("link2");
          const currentWord = document.getElementById("currentWord");

          function updateDictionary(word) {
               const target = word.trim();
               if (!target) {
                    alert("請輸入要查詢的單字。");
                    return;
               }
               const encoded = encodeURIComponent(target);
               frame1.src = dict1 + encoded;
               frame2.src = dict2 + encoded;
               link1.href = dict1 + encoded;
               link2.href = dict2 + encoded;
               currentWord.textContent = `目前查詢：${target}`;
          }

          document.getElementById("searchForm").addEventListener("submit", function (event) {
               event.preventDefault();
               updateDictionary(input.value);
          });
     </script>
</body>

</html>
