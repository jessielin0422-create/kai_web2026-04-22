  <!-- 🎯 彈出視窗 (Modal) - 用於新增管理項目 -->
     <div class="modal fade" id="addModal" tabindex="-1" aria-labelledby="addModalLabel" aria-hidden="true">
          <div class="modal-dialog">
               <div class="modal-content">
                    <div class="modal-header">
                         <h5 class="modal-title fw-bold" id="addModalLabel">新增項目資料</h5>
                         <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <form>
                         <div class="modal-body">
                              <div class="mb-3">
                                   <label class="form-label">名稱 / 標題</label>
                                   <input type="text" class="form-control" required placeholder="請輸入名稱">
                              </div>
                              <div class="mb-3">
                                   <label class="form-label">內容描述</label>
                                   <textarea class="form-control" rows="3" placeholder="請輸入詳細內容說明"></textarea>
                              </div>
                              <div class="mb-3">
                                   <label class="form-label">備註 / 分類</label>
                                   <input type="text" class="form-control" placeholder="請輸入分類標籤">
                              </div>
                         </div>
                         <div class="modal-footer">
                              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                              <button type="submit" class="btn btn-info text-white">確認儲存</button>
                         </div>
                    </form>
               </div>
          </div>
     </div>
