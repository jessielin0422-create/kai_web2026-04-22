<!DOCTYPE html>
<html lang="en">

<head>
     <title>Bootstrap Example</title>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
     <div>
          <h3>modal </h3>
          <p>123456789123456789</p>
          <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">123</button>
          <button type="button" class="btn btn-danger" data-bs-toggle="modal" data-bs-target="#myModal456">456</button>
     </div>

     <!-- modal 123 -->
     <div class="modal" id="myModal">
          <div class="modal-dialog">
               <div class="modal-content">
                    <!-- modal 123 heading -->
                    <div class="modal-header">
                         <h4 class="modal-title">Modal Heading 頭123</h4>
                         <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <!-- modal 123 body -->
                    <div class="modal-body">
                         Modal body 中123
                    </div>

                    <!-- modal 123 footer-->
                    <div class="modal-footer">
                         <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close 尾123</button>
                    </div>

               </div>
          </div>
     </div>

     <!-- modal 456 -->
     <div class="modal" id="myModal456">
          <div class="modal-dialog">
               <div class="modal-content">
                    <!-- modal 456 heading -->
                    <div class="modal-header">
                         <h4 class="modal-title">Modal Heading 頭456</h4>
                         <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>

                    <!-- modal 456 body -->
                    <div class="modal-body">
                         Modal body 中456
                    </div>

                    <!-- modal 456 footer-->
                    <div class="modal-footer">
                         <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Close 尾456</button>
                    </div>

               </div>
          </div>
     </div>


</body>

</html>
