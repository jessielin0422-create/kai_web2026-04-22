<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
          .container-row {
               width: 100%;
               height: 25vh;
               background-color: lightcoral;
               margin: auto;

               display: flex;
               justify-content: space-around;
               align-items: center;
          }

          .container-column {
               width: 30%;
               height: 110vh;
               background-color: lightcoral;
               margin: auto;

               display: flex;
               flex-direction: column;
               justify-content: space-around;
               align-items: center;
               /* justify-content: space-around;
            align-items: center; */
          }

          .item {
               width: 300px;
               height: 300px;
               background-color: aqua;
          }

          h1 {
               text-align: center;
          }
     </style>
</head>

<body>
     <h1>flex row 橫向</h1>
     <div class="container-row">
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
     </div>

     <hr>

     <h1>flex column 直向</h1>
     <div class="container-column">
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>
     </div>


     <p>&nbsp;</p>
     <p>&nbsp;</p>
     <p>&nbsp;</p>
     <p>&nbsp;</p>

</body>

</html>
