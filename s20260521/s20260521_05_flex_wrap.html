<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
          .container-row {
               width: 100%;
               /* height: 50vh; */
               background-color: lightcoral;
               margin: auto;

               display: flex;
               justify-content: space-around;
               align-items: center;
               
               flex-wrap: wrap;
                /* 加上這個後,原本itemu有10個在同一排,全部擠在一起,
               item會依照同一排有的數字設定下(可以放7個看得較清楚),
               弟8個下一個item會自動往下排排 */
          }



          .item {
               width: 300px;
               height: 300px;
               background-color: aqua;

               margin-top: 20px;
               margin-right: 20px;
          }

          .item-hidden{
               opacity: 10%;
          }

          h1 {
               text-align: center;
          }
     </style>
</head>

<body>
     <h1>flex row 橫向</h1>
     <div class="container-row">
          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>

          <div class="item"></div>
          <div class="item item-hidden"></div>
          <div class="item"></div>

          <div class="item"></div>
          <div class="item"></div>
          <div class="item"></div>

          <div class="item"></div>
          <div class="item item-hidden"></div>
          <div class="item"></div>

          <div class="item"></div>
          <div class="item item-hidden"></div>
          <div class="item"></div>

          <div class="item"></div>
          <div class="item item-hidden"></div>
          <div class="item"></div>
     </div>

     <hr>



     <p>&nbsp;</p>
     <p>&nbsp;</p>
     <p>&nbsp;</p>
     <p>&nbsp;</p>

</body>

</html>
