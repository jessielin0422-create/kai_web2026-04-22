<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
          .container {
               width: 80%;
               height: 25vh;
               /* background-color: lightgoldenrodyellow; */
               margin: auto;
               margin-top: 0px;

               /* flex最重要的三個步驟 */
               display: flex;
               justify-content: space-between;
               align-items: center;
          }

          /* container-1 */
          .item11 {
               width: 100%;
               height: 100%;
               background-color: red;
          }

          /* container-2 */
          .item21 {
               width: 50.5%;
               height: 100%;
               background-color: rgb(249, 138, 3);
          }

          .item22 {
               width: 50.5%;
               height: 100%;
               background-color: rgb(208, 166, 102);
          }

          /* container-3 */
          .item31 {
               width: 33.33%;
               height: 100%;
               background-color: rgb(201, 245, 8);
          }

          .item32 {
               width: 33.33%;
               height: 100%;
               background-color: rgb(194, 172, 7);
          }

          .item33 {
               width: 33.33%;
               height: 100%;
               background-color: rgb(230, 215, 103);
          }

          /* container-4 */
          .item41 {
               width: 25.5%;
               height: 100%;
               background-color: rgb(4, 227, 8);
          }

          .item42 {
               width: 25.5%;
               height: 100%;
               background-color: rgb(100, 164, 84);
          }

          .item43 {
               width: 25.5%;
               height: 100%;
               background-color: rgb(41, 153, 37);
          }

          .item44 {
               width: 25.5%;
               height: 100%;
               background-color: rgb(133, 203, 135);
          }
     </style>
</head>

<body>
     <div class="container container-1">
          <div class="item11">100%</div>
     </div>

     <div class="container comtainer-2">
          <div class="item21">50%</div>
          <div class="item22">50%</div>
     </div>

     <div class="container container-3">
          <div class="item31">33.33%</div>
          <div class="item32">33.33%</div>
          <div class="item33">33.33%</div>
     </div>

     <div class="container container-4">
          <div class="item41">25%</div>
          <div class="item42">25%</div>
          <div class="item43">25%</div>
          <div class="item44">25%</div>
     </div>

</body>

</html>
