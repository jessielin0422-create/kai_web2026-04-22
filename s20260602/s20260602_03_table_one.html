<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
          table {
               width: 100%;
               margin: auto;
          }

          table,
          th,
          td {
               /* border: 1px solid black; */
               border: 20px dashed black;
               border-collapse: collapse;
               text-align: center;
          }
          td {
               width: 25%;
               height: 400px;
          }
          .box {
               width: 276px;
               height: 398px;
               background-color: lightblue;
               margin: auto;
               margin-top: 30px;
               margin-bottom: 30px;

               transition: all 2s;
               /* transition: width 3s;*/
          }

          .box:hover {
               transform: scale(1.5) rotate(45deg);
          }

          .box11 {
               background-position: -26px -9px;
          }
          .box12 {background-position: -354px -9px;}
          .box13 {background-position: -681px -9px;}
          .box21 {background-position: -26px 393px;}
          .box22 {background-position: -354px 393px;}
          .box23 {background-position: -681px 393px;}
     </style>
</head>

<body>
     <table>
          <tr>
               <td>
                    <div class="box box11"></div>
               </td>
               <td>
                    <div class="box box12"></div>
               </td>
               <td>
                    <div class="box box13"></div>
               </td>
               <td>
                    <div class=""></div>
               </td>
          </tr>
          <tr>
               <td>
                    <div class=""></div>
               </td>
               <td>
                    <div class="box box21"></div>
               </td>
               <td>
                    <div class="box box22"></div>
               </td>
               <td>
                    <div class="box box23"></div>
               </td>
          </tr>
     </table>
</body>

</html>
