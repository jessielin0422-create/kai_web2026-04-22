                    function handleCityChange() {
                        const citySelect = document.getElementById('addressCity');
                        const districtSelect = document.getElementById('addressDistrict');
                        const customDistrict = document.getElementById('customDistrict');

                        const selectedCity = citySelect.value;

                        if (selectedCity === 'Foreign') {
                            // 使用者選「海外」，隱藏下拉，顯示自填框
                            districtSelect.classList.add('d-none');
                            customDistrict.classList.remove('d-none');
                            customDistrict.value = '';
                        } else if (taiwanDistricts[selectedCity]) {
                            // 使用者選台灣縣市，顯示下拉，隱藏自填框
                            districtSelect.classList.remove('d-none');
                            customDistrict.classList.add('d-none');

                            // 重新生成對應縣市的鄉鎮市區選項
                            districtSelect.innerHTML = '<option value="" selected disabled>請選擇行政區 District</option>';
                            taiwanDistricts[selectedCity].forEach(dist => {
                                const opt = document.createElement('option');
                                opt.value = dist;
                                opt.textContent = dist;
                                districtSelect.appendChild(opt);
                            });
                        }
