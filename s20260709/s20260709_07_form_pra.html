<!DOCTYPE html>
<html lang="en">

<head>
    <title>Bootstrap Example</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .h1 {
            font-family: "標楷體";
            font-size: 24px;
            font-weight: bold;
        }

        .h2 {
            font-family: "標楷體";
            font-size: 36px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>
    <!-- header -->
    <div class="container mt-3">
        <div class="h1">禾 米 眼 鏡 <br> HOME-OPTICAL</div>
        <div class="h2">顧 客 資 料 表 <br> Customer Information Form</div>

        <!-- input text / number / date / radio / checkbox / select / file /  textarea / reset / button / submit  -->
        <form action="/action_page.php">

            <div class="row">
                <!-- select -->
                <div class="col">
                    <label for="sel1" class="form-label">驗光師 Optometrist：</label>
                    <select class="form-select" id="sel1" name="sellist1">
                        <option>Danny</option>
                        <option>2</option>
                    </select>
                </div>
                <div class="col">
                    <!-- date -->
                    <div class="mb-3 mt-3">
                        <label for="name">驗光日期 Exam Date：</label>
                        <input type="date" class="form-control" id="name" placeholder="年/月/日 YYYY-MM-DD" name="name">
                    </div>
                </div>

            </div>

            <!-- text -->
            <div class="row">
                <div class="col-12 col-sm-6">
                    <div class="mb-3 mt-3">
                        <label for="name">中文姓名 Full name：</label>
                        <input type="text" class="form-control" id="name" placeholder="中文姓名 Full name" name="name">
                    </div>
                </div>


                <div class="col-12 col-sm-6">
                    <div class="mb-3 mt-3">
                        <label for="name">暱稱 Nick name：</label>
                        <input type="text" class="form-control" id="name" placeholder="暱稱 Nick name" name="name">
                    </div>
                </div>

                

                <div class="col-12 col-sm-6">
                    <div class="mb-3 mt-3">
                        <label for="name">聯絡電話 Contact number：</label>
                        <input type="text" class="form-control" id="name" placeholder="聯絡電話 Contact number" name="name">
                    </div>
                </div>

                <div class="col">
                    <div class="mb-3 mt-3">
                        <label for="name">生日 Date of Birth：</label>
                        <input type="date" class="form-control" id="name" placeholder="生日 Date of Birth" name="name">
                    </div>
                </div>

                <div class="col-12 col-sm-6">
                    <div class="mb-3 mt-3">
                        <label for="name">職業 Occupation：</label>
                        <input type="text" class="form-control" id="name" placeholder="職業 Occupation" name="name">
                    </div>
                </div>

                <div class="col-12 col-sm-6">
                    <div class="mb-3 mt-3">
                        <label for="name">身分證字號 ID No.：</label>
                        <input type="text" class="form-control" id="name" placeholder="身分證字號 ID No." name="name">
                    </div>
                </div>

                <div class="col-12 col-sm-6">
                    <div class="mb-3 mt-3">
                        <label for="name">聯絡地址 Address：</label>
                        <input type="text" class="form-control" id="name" placeholder="聯絡地址 Address" name="name">
                    </div>
                </div>

                <div class="col-12 col-sm-6">
                    <div class="mb-3 mt-3">
                        <label for="name">聯絡信箱 Email：</label>
                        <input type="text" class="form-control" id="name" placeholder="聯絡信箱 Email" name="name">
                    </div>
                </div>


            </div>
            <!-- text end -->

        

            <!-- radio -->
            <div class="row">
                <div class="col-12 col-sm-6">
                    <label for="sel1" class="form-label">Radio list (select one):</label>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="radio1" name="optradio" value="option1"
                            checked>
                        <label class="form-check-label" for="radio1">Option 1</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" id="radio2" name="optradio" value="option2">
                        <label class="form-check-label" for="radio2">Option 2</label>
                    </div>
                    <div class="form-check">
                        <input type="radio" class="form-check-input" disabled>
                        <label class="form-check-label">Option 3</label>
                    </div>
                </div>

                <!-- checkbox -->
                <div class="col-12 col-sm-6">

                    <label for="sel1" class="form-label">CheckBox list (select):</label>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="check1" name="option1" value="something"
                            checked>
                        <label class="form-check-label" for="check1">Option 1</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" id="check2" name="option2" value="something">
                        <label class="form-check-label" for="check2">Option 2</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" class="form-check-input" disabled>
                        <label class="form-check-label">Option 3</label>
                    </div>
                </div>
            </div>


            <div class="row">
                <div class="col">
                    <!-- select -->
                    <label for="sel1" class="form-label">配鏡用途 Purpose of Glasses/Usage：</label>
                    <select class="form-select" id="sel1" name="sellist1">
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                    </select>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <!-- file -->
                    <div class="mb-3 mt-3">
                        <label for="file">File:</label>
                        <input type="file" class="form-control" id="file" placeholder="Enter name" name="name">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col">
                    <!-- textarea -->
                    <div class="mb-3 mt-3">
                        <label for="comment">Comments:</label>
                        <textarea class="form-control" rows="5" id="comment" name="text"></textarea>
                    </div>
                </div>
            </div>


            <div class="row">
                <div class="col">
                    <button type="reset" class="btn btn-primary">Reset</button>
                </div>
                <div class="col">
                    <button type="submit" class="btn btn-primary">Submit</button>
                </div>
            </div>
        </form>
    </div>

</body>

</html>
