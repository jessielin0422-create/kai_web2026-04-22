<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=
     , initial-scale=1.0">
     <title>Document</title>
     <style>
          table,
          tr,
          td {
               width: 300px;
               height: 300px;
               /* background-color: aqua; */
               /* border: 1px solid black; */
          }

          h3 {
               color: blueviolet;
          }

          .box {
               width: 330px;
               height: 400px;
               /* background-color: rgb(240, 240, 241); */
               background-image: url('./20260514img/one.png');
          }

          .box1-1 {
               background-position: -10px -8px;
          }

          .box1-2 {
               background-image: none;
          }

          .box2-1 {
               background-position: -300px -425px;
          }

          .box2-2 {
               background-position: -630px -425px;
          }

          .box3-1 {
               background-position: -960px -425px;
          }

          .box3-2 {
               background-position: -640px -830px;
          }

          .box4-1 {
               background-image: none;
          }

          .box4-2 {
               background-position: -340px -830px;
          }
     </style>
</head>

<body>
     <h3>解題：語法background-position 在BOX內定位圖片的位置</h3>
     <table>
          <tr>
               <td>
                    <div class="box box1-1"></div>
                    <div class="box box1-2"></div>

               </td>
               <td>
                    <div class="box box2-1"></div>
                    <div class="box box2-2"></div>

               </td>
               <td>
                    <div class="box box3-1"></div>
                    <div class="box box3-2"></div>

               </td>
               <td>
                    <div class="box box4-1"></div>
                    <div class="box box4-2"></div>

               </td>
          </tr>
     </table>
<hr>
 <h3>考題：依照以下圖片做出一模一樣的頁面</h3>
<img src="./20260514img/one.png" alt="原圖題目">


</body>

</html>
