<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
/* position static 是預設值的 靜止不能移動 */
/* word 像剛開始圖片不能動 */
/* 設定成文繞圖後才可以移動*/

          .box{
               position: relative;
               width: 300px;
               height: 300px;
               background: yellow;
               left: 300px;
               top: 500px;
          }
     </style>
</head>
<body>
     <div class="box">
     </div>
</body>
</html>
