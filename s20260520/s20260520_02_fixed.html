<!DOCTYPE html>
<html lang="en">
<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>

body{
     
     height:200px;
     background: lightblue;
}



/* fixed 常用於廣告 要如何擋掉廣告呢? 可以使用按F12後內碼編輯display:none */
          .box{
               width: 300px;
               height: 300px;
          }

.box1{
     background-color: lightcoral;
     position: fixed;
     right: 100px;
     bottom:10px;
}

.box2{
     background-color: lightgreen;
     position: fixed;
     left: 2000px;
     bottom: 18px;
}


     </style>
</head>
<body>
     <div class="box box1">
     </div>
     <div class="box box2">
     </div>
</body>
</html>
