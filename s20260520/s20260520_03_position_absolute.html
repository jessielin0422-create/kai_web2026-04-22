<!DOCTYPE html>
<html lang="en">

<head>
     <meta charset="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <title>Document</title>
     <style>
     /* 框框中的框框 */
     /* 外面 relative */
     /* 裡面 absolute */

     .box{
     width: 300px;
     height: 300px;
     backgroung-color: rgb(14, 78, 10);
     position: relative;
     left: 100px;
     margin-top: 50px;

     }
.box-perple {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: rgb(238, 3, 42);
            top: 0;
            right: 0;

        }

        .box-blue {
            position: absolute;
            width: 30px;
            height: 30px;
            background-color: rgb(77, 31, 141);
            right: 0;
            bottom: 0;

        }
</style>

</head>

<body>

     <div class="box">
          <div class="box-yellow"></div>
          <div class="box-green"></div>
     </div>

     <div class="box">
          <div class="box-yellow"></div>
          <div class="box-green"></div>
     </div>

</body>

</html>
