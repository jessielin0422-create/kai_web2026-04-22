<!DOCTYPE html>
<html lang="zh-TW">

<head>
     <meta charset="UTF-8">
     <title>練習</title>
     <style>
          .box {
               width: 300px;
               height: 300px;
               background: lightblue;
               border-radius: 20px;
               margin: 50px auto;
               position: relative;
          }


          .btn-save {
               position: absolute;
               top: 20px;
               right: 20px;
               background: #4C5B4A;
               /* 森林綠 */
               color: white;
               padding: 5px 15px;
               border: none;
               border-radius: 5px;
               cursor: pointer;
          }

          .box2{
               position:fixed;
               bottom: 20px;
               right: 20px;
               width: 300px;
               height: 300px;
               background-color: lightgreen;
               border:1px solid black;
          }

   .box3 {
               position: sticky;
               top: 50px;
               right: 100px;
               width: 300px;
               height: 300px;
               background-color: rgb(156, 201, 52);
          }


          .img{
               width: 300px;
               height: 300px;
          }

          .h{color: #4314cf;}

     </style>
</head>

<body>
 <h1>flowers world</h1>
