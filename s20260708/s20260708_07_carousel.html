<!DOCTYPE html>
<html lang="en">

<head>
     <title>Bootstrap Example</title>
     <meta charset="utf-8">
     <meta name="viewport" content="width=device-width, initial-scale=1">
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
     <style>
          .box {
               /* width: 100%; */
               height: 100vh background-color: lightblue;
               border-radius: 10px;
               font-style: italic;
               font-weight: bold;
               border-bottom: 2px solid black;
               text-shadow: 1px 1px 2px white;
               color: white;
               font-size: 24px;
          }

          .box11 {
               background-color: lightcoral;
               text-align: center;
          }

          .box21 {
               background-color: lightseagreen;
               opacity: 0.2;
               text-align: center;
          }

          .box22 {
               background-color: lightseagreen;
               opacity: 1;
               text-align: center;
          }

          .box31 {
               background-color: lightpink;
               opacity: 0.2;
               text-align: center;
          }

          .box32 {
               background-color: lightpink;
               opacity: 0.6;
               text-align: center;
          }

          .box33 {
               background-color: lightpink;
               opacity: 1;
               text-align: center;
          }

          .box41 {
               background-color: lightyellow;
               opacity: 0.2;
               text-align: center;
          }

          .box42 {
               background-color: lightyellow;
               opacity: 0.5;
               text-align: center;
          }

          .box43 {
               background-color: lightyellow;
               opacity: 0.8;
               text-align: center;
          }

          .box44 {
               background-color: lightyellow;
               opacity: 1;
               text-align: center;
          }

          .box51 {
               background-color: purple;
               opacity: 0.2;
               text-align: center;
          }

          .box52 {
               background-color: purple;
               opacity: 0.4;
               text-align: center;
          }

          .box53 {
               background-color: purple;
               opacity: 0.6;
               text-align: center;
          }

          .box54 {
               background-color: purple;
               opacity: 0.8;
               text-align: center;
          }

          .box55 {
               background-color: purple;
               opacity: 1;
               text-align: center;
          }
     </style>

</head>

<body>
     <!-- nav -->
     <nav class="navbar navbar-expand-sm navbar-dark bg-dark">
          <div class="container-fluid">
               <a class="navbar-brand" href="javascript:void(0)">Logo</a>
               <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mynavbar">
                    <span class="navbar-toggler-icon"></span>
               </button>
               <div class="collapse navbar-collapse" id="mynavbar">
                    <ul class="navbar-nav me-auto">
                         <li class="nav-item">
                              <a class="nav-link" href="javascript:void(0)">Link</a>
                         </li>
                         <li class="nav-item">
                              <a class="nav-link" href="javascript:void(0)">Link</a>
                         </li>
                         <li class="nav-item">
                              <a class="nav-link" href="javascript:void(0)">Link</a>
                         </li>
                    </ul>
                    <form class="d-flex">
                         <input class="form-control me-2" type="text" placeholder="Search">
                         <button class="btn btn-primary" type="button">Search</button>
                    </form>
               </div>
          </div>
     </nav>
     <!-- nav end-->

     <!-- Carousel 1-->
     <div id="demo" class="carousel slide" data-bs-ride="carousel">

          <!-- Indicators/dots -->
          <div class="carousel-indicators">
               <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
               <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
               <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
          </div>

          <!-- The slideshow/carousel -->
          <div class="carousel-inner">
               <div class="carousel-item active">
                    <img src="https://picsum.photos/id/20/1920/500" alt="Los Angeles" class="d-block"
                         style="width:100%">
               </div>
               <div class="carousel-item">
                    <img src="https://picsum.photos/id/21/1920/500" alt="Chicago" class="d-block" style="width:100%">
               </div>
               <div class="carousel-item">
                    <img src="https://picsum.photos/id/22/1920/500" alt="New York" class="d-block" style="width:100%">
               </div>
          </div>

          <!-- Left and right controls/icons -->
          <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
               <span class="carousel-control-prev-icon"></span>
          </button>
          <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
               <span class="carousel-control-next-icon"></span>
          </button>
     </div>

     <div class="container-fluid mt-3">
          <h3>Carousel Example</h3>
          <p>The following example shows how to create a basic carousel with indicators and controls.</p>
     </div>
     <!-- Carousel 1 end -->


     <div class="container">
          <div class="row">
               <div class="col">


                    <!-- Carousel 2 用兩個以上的話記得改id="demo2" 變成2-->
                    <div id="demo2" class="carousel slide" data-bs-ride="carousel">

                         <!-- Indicators/dots -->
                         <div class="carousel-indicators">
                              <button type="button" data-bs-target="#demo2" data-bs-slide-to="0"
                                   class="active"></button>
                              <button type="button" data-bs-target="#demo2" data-bs-slide-to="1"></button>
                              <button type="button" data-bs-target="#demo2" data-bs-slide-to="2"></button>
                         </div>

                         <!-- The slideshow/carousel -->
                         <div class="carousel-inner">
                              <div class="carousel-item active">
                                   <img src="https://picsum.photos/id/23/1920/500" alt="Los Angeles" class="d-block"
                                        style="width:100%">
                              </div>
                              <div class="carousel-item">
                                   <img src="https://picsum.photos/id/24/1920/500" alt="Chicago" class="d-block"
                                        style="width:100%">
                              </div>
                              <div class="carousel-item">
                                   <img src="https://picsum.photos/id/25/1920/500" alt="New York" class="d-block"
                                        style="width:100%">
                              </div>
                         </div>

                         <!-- Left and right controls/icons -->
                         <button class="carousel-control-prev" type="button" data-bs-target="#demo2"
                              data-bs-slide="prev">
                              <span class="carousel-control-prev-icon"></span>
                         </button>
                         <button class="carousel-control-next" type="button" data-bs-target="#demo2"
                              data-bs-slide="next">
                              <span class="carousel-control-next-icon"></span>
                         </button>
                    </div>
               </div>
               <div class="col">

               </div>
          </div>
     </div>
</body>

</html>
